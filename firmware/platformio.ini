; Dino firmware - ESP32-C3 SuperMini (PlatformIO).
;   Main firmware:   pio run -t upload && pio device monitor          (env dino_c3, the default)
;   Desktop tests:   pio test -e native
;   Hardware checks: envs play_dino, play_inputs, imu_calibrator below, one small program each (src/players/)
[platformio]
default_envs = dino_c3

; ---- Main firmware: src/main.cpp + app/ + modules/ (features switched in include/config.h)
[env:dino_c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; SuperMini prints over its native USB port. RIG_REAL=float: the rig draws with floats on the chip.
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRIG_REAL=float
; The face rig uses C++17 (generic lambdas); the framework default is gnu++11.
build_unflags = -std=gnu++11
; Strict warnings for our own sources only (not the framework / libraries).
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
; players/ holds the stand-alone hardware checks; each has its own env below.
build_src_filter =
    +<*>
    -<players/>
; Host tests only run in env:native.
test_ignore = *

; ---- Wedge-eye firmware: the same logic as dino_c3 with the new-eyes face (page D: wedge eyes, small mouth, no nose).
;      Only the face drawing differs (DINO_WEDGE in src/face/face_wedge.inc); the brain, modules, scenes and sounds are shared.
;   pio run -e dino_wedge_c3 -t upload && pio device monitor -e dino_wedge_c3
[env:dino_wedge_c3]
extends = env:dino_c3
build_flags =
    ${env:dino_c3.build_flags}
    -DDINO_WEDGE=1
    '-DFIRMWARE_NAME="Dino Wedge"'
    '-DFIRMWARE_VERSION="0.4.0-wedge"'

; ---- Touch-only firmware (ADR 012): the whole dino with the touch pad alone, no IMU. Tap = next, long tap = select,
;      the menu is a list. Same logic and modules; only the input mapping and the menu screen differ.
;   pio run -e dino_touch_c3 -t upload && pio device monitor -e dino_touch_c3
[env:dino_touch_c3]
extends = env:dino_c3
build_flags =
    ${env:dino_c3.build_flags}
    -DTOUCH_ONLY=1
    '-DFIRMWARE_NAME="Dino Touch"'
    '-DFIRMWARE_VERSION="0.4.0-touch"'

; Touch-only with the wedge-eye face.
;   pio run -e dino_touch_wedge_c3 -t upload && pio device monitor -e dino_touch_wedge_c3
[env:dino_touch_wedge_c3]
extends = env:dino_c3
build_flags =
    ${env:dino_c3.build_flags}
    -DTOUCH_ONLY=1
    -DDINO_WEDGE=1
    '-DFIRMWARE_NAME="Dino Touch Wedge"'
    '-DFIRMWARE_VERSION="0.4.0-touch-wedge"'

; ---- Hardware checks. Each builds only what it needs plus one file from src/players/.
;      They extend dino_c3, so they must say exactly which sources they use.

; Dino display check (D3): every Face / Life / Utility clip of the design sheet, render time per clip.
;   pio run -e play_dino -t upload && pio device monitor -e play_dino
[env:play_dino]
extends = env:dino_c3
build_src_filter =
    +<face/>
    +<scenes/dino_clips.cpp>
    +<players/play_dino.cpp>

; Dino display check with the wedge face (same clips as play_dino).
;   pio run -e play_dino_wedge -t upload && pio device monitor -e play_dino_wedge
[env:play_dino_wedge]
extends = env:play_dino
build_flags =
    ${env:dino_c3.build_flags}
    -DDINO_WEDGE=1

; Shard-face check: the 12 expressions of the new "Deskimon Shard Face" sheet (v2 rig), morphs included.
;   pio run -e play_shard -t upload && pio device monitor -e play_shard      (touch or n/p = next/previous, t = tour)
[env:play_shard]
extends = env:dino_c3
build_src_filter =
    +<players/play_shard.cpp>

; Boot-up animation preview: the three boot film candidates (src/boot/), film C ends on the real face rig.
;   pio run -e play_boot -t upload && pio device monitor -e play_boot     (keys 1/2/3 pick a film, a = all three, l = loop)
[env:play_boot]
extends = env:dino_c3
build_src_filter =
    +<face/>
    +<boot/>
    +<players/play_boot.cpp>

; Boot film preview with the wedge face (same films as play_boot).
;   pio run -e play_boot_wedge -t upload && pio device monitor -e play_boot_wedge
[env:play_boot_wedge]
extends = env:play_boot
build_flags =
    ${env:dino_c3.build_flags}
    -DDINO_WEDGE=1

; Input check (plan step 1-2): I2C scan, MPU6050 gestures, touch typed in the Serial monitor.
;   pio run -e play_inputs -t upload && pio device monitor -e play_inputs
[env:play_inputs]
extends = env:dino_c3
build_src_filter =
    +<drivers/>
    +<input/>
    +<players/play_inputs.cpp>

; ---- Desktop unit tests for the pure C++ logic (no Arduino): input, timekeeping, utility.
;      Add a new pure folder to build_src_filter when it gets tests.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -DDINO_NATIVE=1
    -Isrc
    -Iinclude
build_src_filter =
    -<*>
    +<boot/>
    +<input/>
    +<life/>
    +<power/>
    +<sound/>
    +<soak/>
    +<timekeeping/>
    +<utility/>
    +<wifi/>
test_build_src = yes

; IMU calibration stream (replaces the Arduino sketch): feeds tools/imu_calibrator/imu_calibrator.html.
;   pio run -e imu_calibrator -t upload      (close the serial monitor, then open the HTML page in Chrome/Edge)
[env:imu_calibrator]
extends = env:dino_c3
lib_deps =
build_src_filter =
    +<players/imu_stream.cpp>
