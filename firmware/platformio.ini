; Dino firmware - ESP32-C3 SuperMini (PlatformIO).
;   Main firmware:   pio run -t upload && pio device monitor          (env dino_c3, the default)
;   Desktop tests:   pio test -e native
;   Hardware checks: envs play_dino, play_inputs, imu_calibrator below, one small program each (src/players/)
[platformio]
default_envs = dino_c3

; ---- Main firmware: src/main.cpp + app/ + modules/ (features switched in include/config.h)
[env:dino_c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; SuperMini prints over its native USB port. RIG_REAL=float: the rig draws with floats on the chip.
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRIG_REAL=float
; The face rig uses C++17 (generic lambdas); the framework default is gnu++11.
build_unflags = -std=gnu++11
; Strict warnings for our own sources only (not the framework / libraries).
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
; players/ holds the stand-alone hardware checks; each has its own env below.
build_src_filter =
    +<*>
    -<players/>
; Host tests only run in env:native.
test_ignore = *

; ---- Hardware checks. Each builds only what it needs plus one file from src/players/.
;      They extend dino_c3, so they must say exactly which sources they use.

; Dino display check (D3): every Face / Life / Utility clip of the design sheet, render time per clip.
;   pio run -e play_dino -t upload && pio device monitor -e play_dino
[env:play_dino]
extends = env:dino_c3
build_src_filter =
    +<face/>
    +<scenes/dino_clips.cpp>
    +<players/play_dino.cpp>

; Input check (plan step 1-2): I2C scan, MPU6050 gestures, touch typed in the Serial monitor.
;   pio run -e play_inputs -t upload && pio device monitor -e play_inputs
[env:play_inputs]
extends = env:dino_c3
build_src_filter =
    +<drivers/>
    +<input/>
    +<players/play_inputs.cpp>

; ---- Desktop unit tests for the pure C++ logic (no Arduino): input, timekeeping, utility.
;      Add a new pure folder to build_src_filter when it gets tests.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -DDINO_NATIVE=1
    -Isrc
    -Iinclude
build_src_filter =
    -<*>
    +<input/>
    +<life/>
    +<power/>
    +<sound/>
    +<timekeeping/>
    +<utility/>
test_build_src = yes

; IMU calibration stream (replaces the Arduino sketch): feeds tools/imu_calibrator/imu_calibrator.html.
;   pio run -e imu_calibrator -t upload      (close the serial monitor, then open the HTML page in Chrome/Edge)
[env:imu_calibrator]
extends = env:dino_c3
lib_deps =
build_src_filter =
    +<players/imu_stream.cpp>
